name: Plugin checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Forbidden files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find . -path './.git' -prune -o -type f \( \
            -name '*.sql' -o -name '*.db' -o -name '*.sqlite' -o -name '*.log' -o \
            -name '.env' -o -name 'wp-config.php' -o -name 'secrets.php' -o \
            -name '*.zip' -o -name '*.tar' -o -name '*.rar' -o -name '*.7z' \
          \) -print)"
          if [ -n "$forbidden" ]; then
            echo "$forbidden"
            exit 1
          fi

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)

      - name: Packs JSON
        shell: bash
        run: |
          set -euo pipefail
          php -r '$ok=true; foreach (glob("packs/*.json") as $f) { json_decode(file_get_contents($f), true); if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, $f . ": " . json_last_error_msg() . PHP_EOL); $ok=false; } } exit($ok ? 0 : 1);'

      - name: Secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{20,})' \
            --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' .; then
            exit 1
          fi
